[pytest]
# `backend/` must be importable as the package root: tests import `app.*`, and
# the default import mode would only add `tests/` to sys.path.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers --strict-config

# Warnings are shown, not hidden. The starlette/httpx one is real and is called
# out in the README rather than filtered away here.
filterwarnings =
    default
